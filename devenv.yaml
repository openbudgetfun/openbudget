# yaml-language-server: $schema=https://devenv.sh/devenv.schema.json
inputs:
  # Keep this tag equal to the devenv CLI installed in .github/actions/devenv.
  devenv:
    url: github:cachix/devenv/v2.4.0?dir=src/modules
  nixpkgs:
    url: github:NixOS/nixpkgs/nixpkgs-unstable
  ifiokjr-nixpkgs:
    url: github:ifiokjr/nixpkgs
  git-hooks:
    url: github:cachix/git-hooks.nix
    inputs:
      nixpkgs:
        follows: nixpkgs
allowUnfree: true
