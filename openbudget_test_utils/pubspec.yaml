name: openbudget_test_utils
description: Shared test helpers for OpenBudget packages.
version: 0.0.0
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

resolution: workspace

flutter:
  uses-material-design: true

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_test:
    sdk: flutter
  go_router: ^18.1.3
  hooks_riverpod: ^3.4.3
  openbudget_core:
    path: ../openbudget_core
  openbudget_ui:
    path: ../openbudget_ui

dev_dependencies:
  openbudget_lints:
    path: ../openbudget_lints
