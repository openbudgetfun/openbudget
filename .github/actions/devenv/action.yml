name: devenv
description: "Setup development environment with devenv and Flutter"
inputs:
  github-token:
    description: Provide a github token
    required: true
  cache-version:
    description: The version of the cache to use.
    required: false
    default: "v1"

runs:
  using: composite
  steps:
    # ── Flutter SDK (fast, with built-in caching) ────────────────────────
    - name: read flutter version
      id: fvm
      run: echo "FLUTTER_VERSION=$(jq -r '.flutter' .fvmrc)" >> "$GITHUB_OUTPUT"
      shell: bash

    - name: install flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ steps.fvm.outputs.FLUTTER_VERSION }}

    - name: link fvm sdk path
      run: mkdir -p .fvm && ln -s "$FLUTTER_ROOT" .fvm/flutter_sdk
      shell: bash

    # ── Nix tools (dprint, nixfmt, shfmt for formatting) ────────────────
    - name: install nix
      uses: DeterminateSystems/nix-installer-action@v17

    - name: install nix tools
      run: nix profile install nixpkgs#dprint nixpkgs#nixfmt nixpkgs#shfmt
      shell: bash

    # ── Dependency caching ───────────────────────────────────────────────
    - name: cache pub dependencies
      uses: actions/cache@v4
      with:
        path: ~/.pub-cache
        key: ${{ runner.os }}-pub-${{ inputs.cache-version }}-${{ hashFiles('**/pubspec.yaml', '**/pubspec.lock') }}
        restore-keys: |
          ${{ runner.os }}-pub-${{ inputs.cache-version }}-

    - name: cache eget
      uses: actions/cache@v4
      with:
        path: ./.eget/bin
        key: ${{ runner.os }}-eget-${{ inputs.cache-version }}-${{ github.job }}-${{ hashFiles('.eget/.eget.toml') }}
        restore-keys: |
          ${{ runner.os }}-eget-${{ inputs.cache-version }}-${{ github.job }}-

    - name: install nix
      uses: cachix/install-nix-action@v31
      with:
        github_access_token: ${{ inputs.github-token }}

    - name: setup nix environment
      run: |
        nix profile add --accept-flake-config nixpkgs#cachix
        cachix use devenv
        nix profile add nixpkgs#devenv
      shell: bash

    - name: install flutter sdk via fvm
      run: |
        fvm install
        fvm use --force
      shell: devenv shell -- bash -e {0}

    - name: install dependencies
      run: install:all
      shell: devenv shell -- bash -e {0}
