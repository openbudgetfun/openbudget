name: devenv
description: "Setup development environment with devenv and Flutter"
inputs:
  github-token:
    description: Provide a github token
    required: true
  cache-version:
    description: The version of the cache to use.
    required: false
    default: "v1"

runs:
  using: composite
  steps:
    # ── Flutter SDK (fast, with built-in caching) ────────────────────────
    - name: read flutter version
      id: fvm
      run: echo "FLUTTER_VERSION=$(jq -r '.flutter' .fvmrc)" >> "$GITHUB_OUTPUT"
      shell: bash

    - name: install flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ steps.fvm.outputs.FLUTTER_VERSION }}

    - name: link fvm sdk path
      run: mkdir -p .fvm && ln -s "$FLUTTER_ROOT" .fvm/flutter_sdk
      shell: bash

    # ── Nix / devenv (provides dprint, nixfmt, shfmt, dartfmt) ───────────
    - name: install nix
      uses: DeterminateSystems/nix-installer-action@v17

    - name: cache nix store
      uses: actions/cache@v4
      with:
        path: |
          /nix/store
          ~/.nix-profile
          ~/.local/state/nix/profiles
        key: ${{ runner.os }}-nix-${{ inputs.cache-version }}-${{ hashFiles('devenv.nix', 'devenv.lock', 'devenv.yaml') }}
        restore-keys: |
          ${{ runner.os }}-nix-${{ inputs.cache-version }}-

    - name: install devenv
      run: nix profile add --accept-flake-config nixpkgs#devenv
      shell: bash

    # ── Dependency caching ───────────────────────────────────────────────
    - name: cache pub dependencies
      uses: actions/cache@v4
      with:
        path: ~/.pub-cache
        key: ${{ runner.os }}-pub-${{ inputs.cache-version }}-${{ hashFiles('**/pubspec.yaml', '**/pubspec.lock') }}
        restore-keys: |
          ${{ runner.os }}-pub-${{ inputs.cache-version }}-

    - name: resolve dependencies
      run: flutter pub get
      shell: devenv shell -- bash -e {0}
