name: setup-mc
description: "Setup development environment with devenv, Flutter, and monochange CLI"
inputs:
  github-token:
    description: Provide a github token
    required: true
  cache-version:
    description: The version of the cache to use.
    required: false
    default: "v1"

runs:
  using: composite
  steps:
    - name: cache pub dependencies
      uses: actions/cache@v4
      with:
        path: ~/.pub-cache
        key: ${{ runner.os }}-pub-${{ inputs.cache-version }}-${{ hashFiles('**/pubspec.yaml', '**/pubspec.lock') }}
        restore-keys: |
          ${{ runner.os }}-pub-${{ inputs.cache-version }}-

    - name: cache eget
      uses: actions/cache@v4
      with:
        path: ./.eget/bin
        key: ${{ runner.os }}-eget-${{ inputs.cache-version }}-${{ github.job }}-${{ hashFiles('.eget/.eget.toml') }}
        restore-keys: |
          ${{ runner.os }}-eget-${{ inputs.cache-version }}-${{ github.job }}-

    - name: install nix
      uses: cachix/install-nix-action@v31
      with:
        github_access_token: ${{ inputs.github-token }}

    - name: setup nix environment
      run: |
        nix profile add --accept-flake-config nixpkgs#cachix
        cachix use devenv
        nix profile add nixpkgs#devenv
      shell: bash

    - name: install flutter sdk via fvm
      run: |
        fvm install
        fvm use --force
      shell: devenv shell -- bash -e {0}

    - name: install dependencies
      run: install:all
      shell: devenv shell -- bash -e {0}

    - name: install monochange CLI
      shell: bash
      run: |
        set -euo pipefail
        MC_VERSION=$(curl -fsSL https://api.github.com/repos/monochange/monochange/releases/latest | grep '"tag_name"' | sed -E 's/.*"v([^"]+)".*/\1/')
        ARCH=$(uname -m)
        OS=$(uname -s | tr '[:upper:]' '[:lower:]')
        case "$ARCH" in
          x86_64)  RUST_ARCH="x86_64" ;;
          aarch64) RUST_ARCH="aarch64" ;;
          *)       echo "Unsupported architecture: $ARCH"; exit 1 ;;
        esac
        case "$OS" in
          linux)   RUST_OS="unknown-linux-gnu" ;;
          darwin)  RUST_OS="apple-darwin" ;;
          *)       echo "Unsupported OS: $OS"; exit 1 ;;
        esac
        TARBALL="monochange-${RUST_ARCH}-${RUST_OS}-v${MC_VERSION}.tar.gz"
        curl -fsSL "https://github.com/monochange/monochange/releases/download/v${MC_VERSION}/${TARBALL}" | tar xz -C /usr/local/bin
        ln -sf /usr/local/bin/monochange /usr/local/bin/mc
        mc --version