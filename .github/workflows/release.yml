name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-pr:
    # Run on every push to main EXCEPT when the release PR was just merged.
    if: "!startsWith(github.event.head_commit.message, 'chore(release): prepare release')"
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: ./.github/actions/setup-mc
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: prepare release PR
        run: mc release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: devenv shell -- bash -e {0}

  tag-release:
    # Run only when the release PR commit lands on main.
    if: "startsWith(github.event.head_commit.message, 'chore(release): prepare release')"
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: ./.github/actions/setup-mc
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: create GitHub releases and tags
        run: mc step:tag-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: devenv shell -- bash -e {0}