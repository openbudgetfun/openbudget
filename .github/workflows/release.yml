name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  release:
    if: github.head_ref == 'knope/release' && github.event.pull_request.merged == true
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT }}

      - uses: knope-dev/action@v2.1.0
        with:
          version: 0.22.2

      - run: knope forced-release
        env:
          GITHUB_TOKEN: ${{ secrets.PAT }}

      - name: Read Flutter version
        id: fvm
        run: echo "FLUTTER_VERSION=$(jq -r '.flutter' .fvmrc)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.FLUTTER_VERSION }}

      - name: Link FVM SDK path
        run: mkdir -p .fvm && ln -s "$FLUTTER_ROOT" .fvm/flutter_sdk

      - run: dart pub get
      - run: dart pub global activate melos

      - run: melos run publish --no-select
        env:
          PUB_CREDENTIALS: ${{ secrets.PUB_CREDENTIALS }}
