name: release

# Every push to main opens or refreshes the release pull request from the
# pending changesets (`monochange run release-pr`). Merging that pull request
# lands a release commit; the next run sees its release record, tags it, and
# publishes the GitHub release (`monochange run publish-release`).
#
# Release notes come in two streams: developer notes in CHANGELOG.md and the
# GitHub release body, and user notes in WHATS_NEW.md plus the JSON the app
# bundles under openbudget_app/assets/release_notes/.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'openbudgetfun/openbudget'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          install-dependencies: "false"

      - name: configure release identity
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          gh auth setup-git
          git fetch --force --tags origin
          # A release branch left by an earlier run must be known locally, or
          # the force-with-lease push that refreshes it is rejected as stale.
          git fetch --force origin '+refs/heads/chore/release/*:refs/remotes/origin/chore/release/*' || true
        shell: bash

      - name: detect a merged release commit
        id: release_record
        run: |
          set -euo pipefail
          error_file="$(mktemp)"
          if is_release_commit="$(
            monochange step release-record \
              --from HEAD \
              --format json \
              --jq '.resolved_commit == .record_commit' \
              2>"$error_file"
          )"; then
            echo "is_release_commit=$is_release_commit" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          if git log -1 --pretty=%B | grep -q '<!-- monochange:release-record:start -->'; then
            echo "::error::The release record in HEAD could not be read."
            sed -n '1,120p' "$error_file" >&2
            exit 1
          fi

          echo "is_release_commit=false" >>"$GITHUB_OUTPUT"
        shell: devenv shell -- bash -e {0}

      - name: tag and publish the release
        if: steps.release_record.outputs.is_release_commit == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: monochange run publish-release
        shell: devenv shell -- bash -e {0}

      - name: open or refresh the release PR
        if: steps.release_record.outputs.is_release_commit != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! find .changeset -type f -name '*.md' -print -quit | grep -q .; then
            echo "No pending changesets."
            exit 0
          fi
          # Changesets that only bump `none` have nothing to release.
          if ! output="$(monochange run release-pr 2>&1)"; then
            if grep -q 'no releaseable packages were found' <<<"$output"; then
              echo "No releaseable packages in the pending changesets."
              exit 0
            fi
            printf '%s\n' "$output" >&2
            exit 1
          fi
          printf '%s\n' "$output"
        shell: devenv shell -- bash -e {0}
