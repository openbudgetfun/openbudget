name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: lint all
        run: lint:all
        shell: devenv shell -- bash -e {0}

  test:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: run flutter tests
        run: melos run test:flutter --no-select
        shell: devenv shell -- bash -e {0}

      - name: run dart tests
        run: melos exec --scope="openbudget_core" -- dart test
        shell: devenv shell -- bash -e {0}

  infra-validate:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: install infra dependencies
        run: install:infra
        shell: devenv shell -- bash -e {0}

      - name: type-check infra
        run: infra:build
        shell: devenv shell -- bash -e {0}

  server-test:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 60
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: openbudget_test
        ports:
          - 9090:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: start redis
        run: |
          docker run -d --name redis-test \
            --network host \
            redis:6.2.6 \
            redis-server --port 9091 --requirepass changeme
          for i in $(seq 1 10); do
            redis-cli -p 9091 -a changeme ping 2>/dev/null && break || sleep 1
          done
      - name: create test passwords
        run: |
          cat > openbudget_server/config/passwords.yaml << 'EOF'
          development:
            database: 'changeme'
            redis: 'changeme'
            serviceSecret: 'ci-service-secret'
            emailSecretHashPepper: 'ci-email-pepper'
            jwtHmacSha512PrivateKey: 'ci-jwt-key-must-be-long-enough-32chars'
            jwtRefreshTokenHashPepper: 'ci-jwt-refresh-pepper'
          test:
            database: 'changeme'
            redis: 'changeme'
            serviceSecret: 'ci-service-secret'
            emailSecretHashPepper: 'ci-email-pepper'
            jwtHmacSha512PrivateKey: 'ci-jwt-key-must-be-long-enough-32chars'
            jwtRefreshTokenHashPepper: 'ci-jwt-refresh-pepper'
          EOF
      - uses: ./.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: run server tests
        run: melos exec --scope="openbudget_server" -- dart test
        shell: devenv shell -- bash -e {0}

  integration-test:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: run integration tests
        run: |
          ./tools/run_patrol_integration_tests.sh
        env:
          PER_FILE_TIMEOUT_SECONDS: 900
        shell: devenv shell -- bash -e {0}

  release-config-guard:
    name: Release config guard
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: validate Shorebird and package IDs
        run: |
          set -euo pipefail

          APP_ID_LINE="$(grep -E '^[[:space:]]*app_id[[:space:]]*:' openbudget_app/shorebird.yaml | head -1 || true)"
          APP_ID_VALUE="$(echo "${APP_ID_LINE}" | sed -E 's/^[[:space:]]*app_id[[:space:]]*:[[:space:]]*//' | sed -E "s/^['\"](.*)['\"]$/\1/" | tr -d '[:space:]')"

          if [ -z "${APP_ID_VALUE}" ]; then
            echo "::warning file=openbudget_app/shorebird.yaml,title=Missing Shorebird app_id::Set a non-empty Shorebird app_id (run 'shorebird init')."
          fi

          if grep -RInE 'com\.example\.' openbudget_app; then
            echo "::error title=Placeholder package IDs detected::Replace com.example.* package IDs in app platform configs."
            exit 1
          fi

          echo "Release config guard passed."

  native-change-check:
    name: Detect native dependency changes
    runs-on: blacksmith-2vcpu-ubuntu-2404
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: check for native dependency changes
        run: |
          BASE=${{ github.event.pull_request.base.sha }}

          NATIVE_FILES=(
            "openbudget_app/ios/Podfile"
            "openbudget_app/ios/Podfile.lock"
            "openbudget_app/ios/Runner.xcodeproj/project.pbxproj"
            "openbudget_app/android/app/build.gradle.kts"
            "openbudget_app/android/build.gradle.kts"
            "openbudget_app/android/settings.gradle.kts"
            "openbudget_app/android/gradle/wrapper/gradle-wrapper.properties"
            "openbudget_app/macos/Podfile"
            "openbudget_app/macos/Podfile.lock"
            "openbudget_app/linux/CMakeLists.txt"
            "openbudget_app/windows/CMakeLists.txt"
          )

          CHANGED=false
          for file in "${NATIVE_FILES[@]}"; do
            if git diff --name-only "$BASE"...HEAD | grep -q "^$file$"; then
              echo "::warning::Native file changed: $file"
              CHANGED=true
            fi
          done

          if git diff "$BASE"...HEAD -- openbudget_app/pubspec.yaml | grep -E '^\+.*:' | grep -vE '^\+\+\+|^\+\s*#|^\+\s*$|path:|sdk:' | head -20; then
            echo "::notice::App pubspec.yaml dependencies changed — review for native plugins"
          fi

          if [ "$CHANGED" = true ]; then
            echo "::warning::Native dependencies changed! This PR requires a MAJOR version bump for openbudget_app (full app store release). Shorebird patches cannot include native changes."
          else
            echo "No native dependency changes detected. Safe for Shorebird patch (minor/patch bump)."
          fi
