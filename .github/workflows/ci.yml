name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  conventional-commits:
    name: Enforce Conventional Commits and PR Title
    runs-on: blacksmith-2vcpu-ubuntu-2404
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: validate commit messages and PR title
        run: |
          set -euo pipefail

          REGEX='^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([a-z0-9._/-]+\))?!?: .+'
          PR_TITLE="${{ github.event.pull_request.title }}"

          if ! [[ "$PR_TITLE" =~ $REGEX ]]; then
            echo "::error::PR title must follow Conventional Commits."
            echo "Got: $PR_TITLE"
            echo "Expected format: type(scope): subject"
            exit 1
          fi

          BASE="${{ github.event.pull_request.base.sha }}"
          INVALID=0

          while IFS= read -r subject; do
            [ -z "$subject" ] && continue
            # Ignore merge commits generated by Git.
            if [[ "$subject" =~ ^Merge\  ]]; then
              continue
            fi
            if ! [[ "$subject" =~ $REGEX ]]; then
              echo "::error::Non-conventional commit subject: $subject"
              INVALID=1
            fi
          done < <(git log --format='%s' "$BASE"..HEAD)

          if [ "$INVALID" -ne 0 ]; then
            echo "::error::One or more commit messages are not conventional."
            exit 1
          fi

  analyze:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: lint analyze
        run: melos run analyze --no-select

  test:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: run flutter tests
        run: melos run test:flutter --no-select
      - name: run dart tests
        run: melos exec --scope="openbudget_core" -- dart test

  server-test:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: openbudget_test
        ports:
          - 9090:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: start redis
        run: |
          docker run -d --name redis-test \
            --network host \
            redis:6.2.6 \
            redis-server --port 9091 --requirepass changeme
          for i in $(seq 1 10); do
            redis-cli -p 9091 -a changeme ping 2>/dev/null && break || sleep 1
          done
      - name: create test passwords
        run: |
          cat > openbudget_server/config/passwords.yaml << 'EOF'
          development:
            database: 'changeme'
            redis: 'changeme'
            serviceSecret: 'ci-service-secret'
            emailSecretHashPepper: 'ci-email-pepper'
            jwtHmacSha512PrivateKey: 'ci-jwt-key-must-be-long-enough-32chars'
            jwtRefreshTokenHashPepper: 'ci-jwt-refresh-pepper'
          test:
            database: 'changeme'
            redis: 'changeme'
            serviceSecret: 'ci-service-secret'
            emailSecretHashPepper: 'ci-email-pepper'
            jwtHmacSha512PrivateKey: 'ci-jwt-key-must-be-long-enough-32chars'
            jwtRefreshTokenHashPepper: 'ci-jwt-refresh-pepper'
          EOF
      - uses: ./.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: run server tests
        run: melos exec --scope="openbudget_server" -- dart test

  format:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: check dart formatting
        run: dart format --set-exit-if-changed .
      - name: check dprint formatting
        run: dprint check

  integration-test:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: install linux desktop dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libx11-dev pkg-config cmake ninja-build libblkid-dev libwebkit2gtk-4.1-dev libsecret-1-dev
      - uses: ./.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: run integration tests
        run: |
          cd openbudget_app
          xvfb-run bash -c '
            for f in integration_test/*_test.dart; do
              echo "::group::Running $f"
              flutter test "$f" -d linux
              echo "::endgroup::"
            done
          '

  no-stateful-or-stateless:
    name: Ban StatefulWidget and StatelessWidget
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - name: check for banned widget types
        run: |
          VIOLATIONS=$(grep -rn 'extends StatefulWidget\|extends StatelessWidget' \
            --include='*.dart' \
            --exclude-dir='.dart_tool' \
            --exclude-dir='generated' \
            --exclude='*.g.dart' \
            --exclude='*.freezed.dart' \
            . || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "::error::StatefulWidget and StatelessWidget are banned."
            echo "Use HookWidget or HookConsumerWidget instead."
            echo ""
            echo "$VIOLATIONS"
            exit 1
          fi
          echo "No banned widget types found."

  native-change-check:
    name: Detect native dependency changes
    runs-on: blacksmith-2vcpu-ubuntu-2404
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: check for native dependency changes
        run: |
          BASE=${{ github.event.pull_request.base.sha }}

          NATIVE_FILES=(
            "openbudget_app/ios/Podfile"
            "openbudget_app/ios/Podfile.lock"
            "openbudget_app/ios/Runner.xcodeproj/project.pbxproj"
            "openbudget_app/android/app/build.gradle.kts"
            "openbudget_app/android/build.gradle.kts"
            "openbudget_app/android/settings.gradle.kts"
            "openbudget_app/android/gradle/wrapper/gradle-wrapper.properties"
            "openbudget_app/macos/Podfile"
            "openbudget_app/macos/Podfile.lock"
            "openbudget_app/linux/CMakeLists.txt"
            "openbudget_app/windows/CMakeLists.txt"
          )

          CHANGED=false
          for file in "${NATIVE_FILES[@]}"; do
            if git diff --name-only "$BASE"...HEAD | grep -q "^$file$"; then
              echo "::warning::Native file changed: $file"
              CHANGED=true
            fi
          done

          if git diff "$BASE"...HEAD -- openbudget_app/pubspec.yaml | grep -E '^\+.*:' | grep -vE '^\+\+\+|^\+\s*#|^\+\s*$|path:|sdk:' | head -20; then
            echo "::notice::App pubspec.yaml dependencies changed — review for native plugins"
          fi

          if [ "$CHANGED" = true ]; then
            echo "::warning::Native dependencies changed! This PR requires a MAJOR version bump for openbudget_app (full app store release). Shorebird patches cannot include native changes."
          else
            echo "No native dependency changes detected. Safe for Shorebird patch (minor/patch bump)."
          fi

  pinned-deps:
    name: Enforce pinned app dependencies
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - name: check for unpinned dependencies
        run: |
          VIOLATIONS=$(sed -n '/^dependencies:/,/^[^ ]/p' openbudget_app/pubspec.yaml \
            | grep -E ':\s*[\^>~]' \
            | grep -v '^\s*#' \
            || true)

          if [ -n "$VIOLATIONS" ]; then
            echo "::error::openbudget_app has unpinned dependencies. All app dependencies must use exact versions (no ^, >=, ~)."
            echo ""
            echo "$VIOLATIONS"
            echo ""
            echo "Pin to exact versions (e.g., 'cupertino_icons: 1.0.8' instead of 'cupertino_icons: ^1.0.8')"
            exit 1
          fi
          echo "All app dependencies are pinned to exact versions."

  secrets-scan:
    name: Secrets Detection
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: install gitleaks
        run: |
          GITLEAKS_VERSION=8.24.3
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar xz -C /usr/local/bin gitleaks
      - name: run gitleaks
        run: gitleaks detect --source . --verbose --redact --config .gitleaks.toml
