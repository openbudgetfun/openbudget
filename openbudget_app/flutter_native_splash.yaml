# Source images are rendered from `brand/*.svg` by
# `dart run openbudget_scripts:render_brand` (run from the repository root),
# which then runs this generator. Colours are `ObSwatch.paper` and
# `ObSwatch.night`.
flutter_native_splash:
  color: "#FCF8EF"
  color_dark: "#1D2131"
  image: build/brand/splash.png
  image_dark: build/brand/splash_night.png
  android: true
  ios: true
  web: true
  fullscreen: true
  android_12:
    color: "#FCF8EF"
    color_dark: "#1D2131"
    image: build/brand/splash_android12.png
    image_dark: build/brand/splash_android12_night.png
    icon_background_color: "#FCF8EF"
    icon_background_color_dark: "#1D2131"
