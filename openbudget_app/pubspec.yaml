name: openbudget_app
description: OpenBudget — cross-platform envelope budgeting app.
publish_to: none
version: 1.0.0

environment:
  sdk: ^3.11.0
  flutter: ^3.41.0

resolution: workspace

dependencies:
  cupertino_icons: 1.0.8
  equatable: 2.0.8
  flutter:
    sdk: flutter
  flutter_hooks: 0.21.3+1
  flutter_localizations:
    sdk: flutter
  go_router: 15.1.3
  google_fonts: 8.0.1
  hooks_riverpod: 3.2.1
  intl: any
  json_annotation: 4.9.0
  logging: 1.3.0
  openbudget_client:
    path: ../openbudget_client
  openbudget_core:
    path: ../openbudget_core
  openbudget_ui:
    path: ../openbudget_ui
  plaid_flutter: 5.0.5
  posthog_flutter: 5.14.0
  riverpod_annotation: 4.0.2
  serverpod_auth_idp_flutter: 3.3.1
  serverpod_flutter: 3.3.1
  shared_preferences: 2.5.3
  shorebird_code_push: 2.0.5
  simple_icons: 14.6.1
  solana_mobile_client:
    path: ../third_party/solana_mobile_client

dev_dependencies:
  build_runner: 2.11.1
  flutter_driver:
    sdk: flutter
  flutter_launcher_icons: 0.14.4
  flutter_native_splash: 2.4.7
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  json_serializable: 6.11.4
  openbudget_lints:
    path: ../openbudget_lints
  openbudget_test_utils:
    path: ../openbudget_test_utils
  patrol: 3.20.0
  riverpod_generator: 4.0.3

patrol:
  app_name: OpenBudget
  android:
    package_name: com.openbudget.app
  ios:
    bundle_id: com.openbudget.app
  macos:
    bundle_id: com.openbudget.app

flutter:
  generate: true
  default-flavor: dev
  uses-material-design: true
  assets:
    - assets/config.json
    - assets/branding/logos/
