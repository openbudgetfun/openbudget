name: openbudget_app
description: OpenBudget — cross-platform envelope budgeting app.
publish_to: none
version: 1.0.0

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

resolution: workspace

dependencies:
  cupertino_icons: 2.0.0
  equatable: 2.1.0
  flutter:
    sdk: flutter
  flutter_hooks: 0.21.3+1
  flutter_localizations:
    sdk: flutter
  go_router: 18.1.3
  hooks_riverpod: 3.4.3
  intl: any
  json_annotation: 4.12.0
  logging: 1.3.0
  openbudget_client:
    path: ../openbudget_client
  openbudget_core:
    path: ../openbudget_core
  openbudget_ui:
    path: ../openbudget_ui
  plaid_flutter: 5.2.1
  posthog_flutter: 5.58.4
  riverpod_annotation: 4.0.7
  serverpod_auth_idp_flutter: 4.1.0
  serverpod_flutter: 4.1.0
  shared_preferences: 2.5.6
  shorebird_code_push: 2.0.7

dev_dependencies:
  build_runner: 2.16.1
  flutter_driver:
    sdk: flutter
  flutter_launcher_icons: 0.14.4
  flutter_native_splash: 2.4.8
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  json_serializable: 6.15.2
  openbudget_lints:
    path: ../openbudget_lints
  openbudget_test_utils:
    path: ../openbudget_test_utils
  patrol: 4.11.0
  riverpod_generator: 4.0.9

patrol:
  app_name: OpenBudget
  test_directory: integration_test
  android:
    package_name: com.openbudget.app
  ios:
    bundle_id: com.openbudget.app
  macos:
    bundle_id: com.openbudget.app

flutter:
  config:
    # Keep the existing iOS and macOS CocoaPods integration.
    enable-swift-package-manager: false
  generate: true
  default-flavor: dev
  uses-material-design: true
  assets:
    - assets/branding/logos/
    - assets/config.json
    - assets/release_notes/
