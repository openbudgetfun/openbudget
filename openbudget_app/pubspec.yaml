name: openbudget_app
description: OpenBudget — cross-platform envelope budgeting app.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.11.0
  flutter: ^3.41.0

resolution: workspace

dependencies:
  cupertino_icons: 1.0.8
  flutter:
    sdk: flutter
  flutter_hooks: 0.21.3+1
  flutter_localizations:
    sdk: flutter
  freezed_annotation: 3.1.0
  go_router: 15.1.3
  hooks_riverpod: 3.2.1
  intl: any
  json_annotation: 4.9.0
  openbudget_client:
    path: ../openbudget_client
  openbudget_core:
    path: ../openbudget_core
  openbudget_ui:
    path: ../openbudget_ui
  riverpod_annotation: 4.0.2
  serverpod_auth_idp_flutter: 3.3.0
  serverpod_flutter: 3.3.0
  shorebird_code_push: 2.0.5

dev_dependencies:
  build_runner: 2.11.1
  flutter_test:
    sdk: flutter
  freezed: 3.2.5
  integration_test:
    sdk: flutter
  json_serializable: 6.11.4
  openbudget_lints:
    path: ../openbudget_lints
  openbudget_test_utils:
    path: ../openbudget_test_utils
  patrol: 3.20.0
  riverpod_generator: 4.0.3

patrol:
  app_name: OpenBudget
  android:
    package_name: com.example.openbudget_app
  ios:
    bundle_id: com.example.openbudgetFlutter
  macos:
    bundle_id: com.example.openbudgetFlutter

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/config.json
