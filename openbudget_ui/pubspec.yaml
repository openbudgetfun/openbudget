name: openbudget_ui
description: Shared Flutter widgets and theme for OpenBudget.
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.11.0
  flutter: ^3.41.0

resolution: workspace

flutter:
  uses-material-design: true

dependencies:
  flutter:
    sdk: flutter
  flutter_hooks: ^0.21.0
  google_fonts: ^8.0.1
  openbudget_core:
    path: ../openbudget_core
  openbudget_wired:
    path: ../openbudget_wired

dev_dependencies:
  flutter_test:
    sdk: flutter
  openbudget_lints:
    path: ../openbudget_lints
