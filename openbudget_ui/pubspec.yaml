name: openbudget_ui
description: Shared Flutter widgets and theme for OpenBudget.
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

resolution: workspace

flutter:
  uses-material-design: true

dependencies:
  flutter:
    sdk: flutter
  flutter_hooks: ^0.21.3+1
  google_fonts: ^8.2.1
  openbudget_core:
    path: ../openbudget_core

dev_dependencies:
  flutter_test:
    sdk: flutter
  openbudget_lints:
    path: ../openbudget_lints
