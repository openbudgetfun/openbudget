name: openbudget_ui
description: Shared Flutter widgets and theme for OpenBudget.
version: 0.0.0
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

resolution: workspace

flutter:
  uses-material-design: true

dependencies:
  flutter:
    sdk: flutter
  flutter_hooks: ^0.21.3+1
  openbudget_core:
    path: ../openbudget_core
  # Parses the mark's SVG path data (`ObMark`).
  path_parsing: ^1.1.0
  skribble: 0.3.1
  skribble_font_recursive: 0.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  openbudget_lints:
    path: ../openbudget_lints
  # Sources of the hand-drawn catalogs that tool/generate_openbudget_icons.dart
  # copies from; never imported by the library.
  skribble_icons_lucide: 0.3.1
  skribble_icons_simple: 0.3.1
