name: openbudget_workspace
publish_to: none

environment:
  sdk: ^3.13.0

workspace:
  - openbudget_app
  - openbudget_client
  - openbudget_scripts
  - openbudget_server
  - openbudget_core
  - openbudget_ui
  - openbudget_lints
  - openbudget_test_utils

dev_dependencies:
  melos: ^8.6.0
  serverpod_cli: 4.1.0

dependency_overrides:
  # Serverpod and coverage need newer APIs; launcher_icons still caps its compatible logger at 0.4.
  cli_util: 0.6.0
  # solana_kit_wallet_ui asks for the 1.x icon font; 2.0 only adds glyphs.
  cupertino_icons: 2.0.0
  # solana_kit_wallet_ui still declares skribble ^0.1.1, while openbudget_ui pins the
  # 0.3 line. The wallet UI uses only APIs that 0.3 keeps, so resolve one skribble.
  skribble: 0.3.1

melos:
  name: openbudget
  sdkPath: .fvm/flutter_sdk

  scripts:
    analyze:
      description: Run dart analyze across all packages.
      exec: dart analyze --fatal-infos .

    test:
      description: Run tests in all packages.
      exec: dart test
      packageFilters:
        dirExists: test

    test:flutter:
      description: Run Flutter tests in Flutter packages.
      run: dart run melos exec --concurrency=1 --depends-on=flutter --dir-exists=test -- flutter test

    generate:
      description: Run build_runner in all packages that use it.
      exec: dart run build_runner build
      packageFilters:
        dependsOn: build_runner

    generate:watch:
      description: Run build_runner in watch mode.
      exec: dart run build_runner watch
      packageFilters:
        dependsOn: build_runner

    serverpod:generate:
      description: Run Serverpod code generation.
      run: cd openbudget_server && dart run serverpod_cli --no-analytics generate

    clean:
      description: Clean all packages.
      exec: flutter clean
      packageFilters:
        dependsOn: flutter

    test:integration:
      description: Run Patrol integration tests.
      run: cd openbudget_app && flutter test integration_test

    upgrade:
      description: Upgrade dependencies in all packages.
      exec: dart pub upgrade
