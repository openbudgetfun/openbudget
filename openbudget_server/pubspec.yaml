name: openbudget_server
description: Starting point for a Serverpod server.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.11.0

resolution: workspace

dependencies:
  logging: ^1.3.0
  mailer: ^6.5.0
  openbudget_core:
    path: ../openbudget_core
  serverpod: 3.3.1
  serverpod_auth_idp_server: 3.3.1
  solana_kit: ^0.2.1
  solana_kit_helius: ^0.2.1

dev_dependencies:
  openbudget_lints:
    path: ../openbudget_lints
  serverpod_test: 3.3.1
  test: ^1.25.5

serverpod:
  scripts:
    # Starts the server and applies migrations
    start: dart bin/main.dart --apply-migrations

    # Build the Flutter web app and copy it to the server's web directory.
    # Windows uses xcopy since flutter's --output flag doesn't work there.
    # See: https://github.com/flutter/flutter/issues/157886
    flutter_build:
      windows: >-
        (if exist web\app rmdir /S /Q web\app)
        & cd /D ..\openbudget_app
        && flutter build web --base-href /app/ --wasm
        && xcopy /E /I /Y build\web ..\openbudget_server\web\app
      posix: |
        cd ../openbudget_app
        flutter build web --base-href /app/ --wasm --output ../openbudget_server/web/app
