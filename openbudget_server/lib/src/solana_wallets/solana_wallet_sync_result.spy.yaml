### Sync response payload for Solana wallet refreshes.
class: SolanaWalletSyncResult
fields:
  walletId: UuidValue
  insertedTransactions: int
  updatedTransactions: int
  holdingCount: int
  pricedHoldingCount: int
  staleHoldingCount: int
  unpricedHoldingCount: int
  valuationCoverageRatio: double?
  totalValuation: double?
  valuationCurrency: String?
  syncedAt: DateTime
  warnings: String?
