### A financial transaction within a budget, optionally assigned to an envelope.
class: Transaction
table: transaction
fields:
  id: UuidValue?, defaultPersist=random_v7
  description: String
  ### Amount in integer cents. Positive = inflow, negative = outflow.
  amountCents: int
  ### ISO 4217 currency code.
  currencyCode: String
  envelopeId: UuidValue?, relation(parent=envelope)
  budgetId: UuidValue, relation(parent=budget)
  transactionDate: DateTime
  createdAt: DateTime, default=now
indexes:
  transaction_envelope_idx:
    fields: envelopeId
  transaction_budget_idx:
    fields: budgetId
  transaction_date_idx:
    fields: transactionDate
