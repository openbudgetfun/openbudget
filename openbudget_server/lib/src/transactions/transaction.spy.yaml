### A financial transaction within a budget, optionally assigned to an envelope.
class: Transaction
table: transaction
fields:
  id: UuidValue?, defaultPersist=random_v7
  description: String
  ### Amount in integer cents. Positive = inflow, negative = outflow.
  amountCents: int
  ### ISO 4217 currency code.
  currencyCode: String
  envelopeId: UuidValue?, relation(parent=envelope)
  budgetId: UuidValue, relation(parent=budget)
  ### The account this transaction belongs to (optional for backwards compat).
  accountId: UuidValue?, relation(parent=account)
  ### The payee associated with this transaction.
  payeeId: UuidValue?, relation(parent=payee)
  transactionDate: DateTime
  ### If this transaction is part of a transfer, this links to the paired transaction.
  transferPairId: UuidValue?
  createdAt: DateTime, default=now
indexes:
  transaction_envelope_idx:
    fields: envelopeId
  transaction_budget_idx:
    fields: budgetId
  transaction_account_idx:
    fields: accountId
  transaction_payee_idx:
    fields: payeeId
  transaction_date_idx:
    fields: transactionDate
