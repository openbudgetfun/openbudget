### A grouping of envelopes within a budget.
class: Category
table: category
fields:
  id: UuidValue?, defaultPersist=random_v7
  name: String
  budgetId: UuidValue, relation(parent=budget)
  sortOrder: int
  ### Whether this category is hidden from the default budget view.
  isHidden: bool?, default=false
  createdAt: DateTime, default=now
indexes:
  category_budget_idx:
    fields: budgetId
