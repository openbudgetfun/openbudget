### Per-month allocation for an envelope, enabling monthly budget cycles.
class: MonthlyAllocation
table: monthly_allocation
fields:
  id: UuidValue?, defaultPersist=random_v7
  envelopeId: UuidValue, relation(parent=envelope)
  budgetId: UuidValue, relation(parent=budget)
  ### The year of the budget month (e.g. 2026).
  year: int
  ### The month of the budget month (1-12).
  month: int
  ### Amount allocated to this envelope for this month, in integer cents.
  allocatedCents: int
  ### Amount carried over from the previous month, in integer cents.
  carryoverCents: int
  createdAt: DateTime, default=now
  updatedAt: DateTime, default=now
indexes:
  monthly_allocation_envelope_idx:
    fields: envelopeId
  monthly_allocation_budget_idx:
    fields: budgetId
  monthly_allocation_unique_idx:
    fields: envelopeId, year, month
    unique: true
