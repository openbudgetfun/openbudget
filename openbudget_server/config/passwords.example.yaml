# Copy the entries you need into config/passwords.yaml (gitignored), or set
# each one with `serverpod cloud password set <key> --from-file <file>`.
#
# The keys live under the run mode section, for example `development:`.

development:
  # Google web OAuth client, as downloaded from Google Cloud. The server
  # verifies web tokens and exchanges web authorization codes with this client.
  googleClientSecret: |
    {
      "web": {
        "client_id": "<web-client-id>.apps.googleusercontent.com",
        "client_secret": "<web-client-secret>",
        "redirect_uris": []
      }
    }

  # Apple Sign in with Apple configuration. All six values are required by
  # Serverpod to construct the provider, including for native iOS sign-in.
  appleServiceIdentifier: "<apple-service-id>"
  appleBundleIdentifier: "com.openbudget.app"
  appleRedirectUri: "https://<your-host>/auth/apple/callback"
  appleTeamId: "<apple-team-id>"
  appleKeyId: "<apple-key-id>"
  # The full contents of the .p8 file, including its BEGIN/END lines.
  appleKey: "<contents-of-the-p8-file>"

  # Optional. Android application id used for the Apple web callback.
  appleAndroidPackageIdentifier: "com.openbudget.app"

  # CoinGecko price API. Pro (Basic plan or higher) wins when both are set;
  # demo is development-only. Env fallbacks: COINGECKO_PRO_API_KEY and
  # COINGECKO_DEMO_API_KEY.
  coingeckoProApiKey: "<coingecko-pro-api-key>"
  coingeckoDemoApiKey: "<coingecko-demo-api-key>"
